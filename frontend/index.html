<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROPXAI - Smart Crop Recommendation System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>🌾 CROPXAI</h1>
                <p class="tagline" data-translate="tagline">AI-Powered Crop Recommendations</p>
            </div>
            <div class="header-controls">
                <select id="languageSelector" class="language-selector">
                    <option value="en">English</option>
                    
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="hi">हिंदी (Hindi)</option>
                </select>
                <button id="loginBtn" class="btn-primary" data-translate="login">Login</button>
            </div>
        </header>

        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="authTitle" data-translate="loginTitle">Farmer Login</h2>
                <form id="loginForm">
                    <input type="text" id="username" placeholder="Username" data-translate-placeholder="username" required>
                    <input type="password" id="password" placeholder="Password" data-translate-placeholder="password" required>
                    <button type="submit" class="btn-primary" data-translate="loginBtn">Login</button>
                    <div class="auth-links">
                        <a href="#" id="createAccountLink" data-translate="createAccount">Create New Account</a>
                        <a href="#" id="forgotPasswordLink" data-translate="forgotPassword">Forgot Password?</a>
                    </div>
                </form>
                <form id="registerForm" style="display: none;">
                    <input type="text" id="newUsername" placeholder="Username" data-translate-placeholder="username" required>
                    <input type="email" id="newEmail" placeholder="Email" data-translate-placeholder="email" required>
                    <input type="password" id="newPassword" placeholder="Password" data-translate-placeholder="password" required>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" data-translate-placeholder="confirmPassword" required>
                    <input type="text" id="farmerName" placeholder="Full Name" data-translate-placeholder="fullName" required>
                    <button type="submit" class="btn-primary" data-translate="registerBtn">Register</button>
                    <a href="#" id="backToLoginLink" data-translate="backToLogin">Back to Login</a>
                </form>
                <form id="forgotPasswordForm" style="display: none;">
                    <input type="text" id="resetUsername" placeholder="Username" data-translate-placeholder="username" required>
                    <input type="email" id="resetEmail" placeholder="Email" data-translate-placeholder="email" required>
                    <input type="password" id="resetNewPassword" placeholder="New Password" data-translate-placeholder="newPassword" required>
                    <button type="submit" class="btn-primary" data-translate="resetBtn">Reset Password</button>
                    <a href="#" id="backToLoginLink2" data-translate="backToLogin">Back to Login</a>
                </form>
            </div>
        </div>

        <main id="mainContent" style="display: none;">
            <div class="welcome-section">
                <div class="profile-info">
                    <div class="profile-avatar">👨‍🌾</div>
                    <div>
                        <h2 data-translate="welcome">Welcome to Your Dashboard</h2>
                        <p id="profileName" class="profile-name"></p>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="insuranceBtn" class="btn-insurance" title="Crop Insurance">🛡️ <span data-translate="insurance">Insurance</span></button>
                    <button id="voiceBtn" class="btn-voice" title="Voice Assistant">🎤</button>
                    <button id="profileBtn" class="btn-secondary" data-translate="profile">Profile</button>
                    <button id="logoutBtn" class="btn-secondary" data-translate="logout">Logout</button>
                </div>
            </div>

            <div class="dashboard">
                <section class="input-section">
                    <h3 data-translate="inputTitle">Enter Your Farm Details</h3>
                    
                    <div class="form-group">
                        <label data-translate="climate">Climate:</label>
                        <select id="climate" required>
                            <option value="">Select Climate</option>
                            <option value="tropical">Tropical</option>
                            <option value="subtropical">Subtropical</option>
                            <option value="temperate">Temperate</option>
                            <option value="arid">Arid</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label data-translate="area">Area (in acres):</label>
                        <input type="number" id="area" min="0.1" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label data-translate="season">Season:</label>
                        <select id="season" required>
                            <option value="">Select Season</option>
                            <option value="kharif">Kharif (Monsoon)</option>
                            <option value="rabi">Rabi (Winter)</option>
                            <option value="zaid">Zaid (Summer)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label data-translate="soilType">Soil Type:</label>
                        <select id="soilType" required>
                            <option value="">Select Soil Type</option>
                            <option value="clay">Clay</option>
                            <option value="sandy">Sandy</option>
                            <option value="loamy">Loamy</option>
                            <option value="black">Black</option>
                            <option value="red">Red</option>
                            <option value="alluvial">Alluvial</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label data-translate="soilPh">Soil pH Value:</label>
                        <input type="number" id="soilPh" min="3" max="10" step="0.1" required>
                        <button type="button" class="info-btn" id="phInfoBtn">ℹ️</button>
                        <button type="button" class="auto-btn" id="autoPhBtn" data-translate="autoDetect">Auto Detect</button>
                    </div>

                    <div class="form-group">
                        <label data-translate="nitrogen">Nitrogen (N) %:</label>
                        <input type="number" id="nitrogen" min="0" max="100" step="0.1" required>
                        <button type="button" class="auto-btn" id="autoNBtn" data-translate="autoDetect">Auto Detect</button>
                    </div>

                    <div class="form-group">
                        <label data-translate="phosphorus">Phosphorus (P) %:</label>
                        <input type="number" id="phosphorus" min="0" max="100" step="0.1" required>
                        <button type="button" class="auto-btn" id="autoPBtn" data-translate="autoDetect">Auto Detect</button>
                    </div>

                    <div class="form-group">
                        <label data-translate="potassium">Potassium (K) %:</label>
                        <input type="number" id="potassium" min="0" max="100" step="0.1" required>
                        <button type="button" class="info-btn" id="npkInfoBtn">ℹ️</button>
                        <button type="button" class="auto-btn" id="autoKBtn" data-translate="autoDetect">Auto Detect</button>
                    </div>

                    <button id="recommendBtn" class="btn-primary btn-large" data-translate="getRecommendation">Get Crop Recommendation</button>
                </section>

                <section id="resultsSection" class="results-section" style="display: none;">
                    <h3 data-translate="recommendationTitle">Recommended Crop</h3>
                    <div id="recommendationResults"></div>
                </section>
            </div>
        </main>

        <div id="infoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="infoContent"></div>
            </div>
        </div>

        <div id="profileModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 data-translate="profileTitle">User Profile</h2>
                <div id="profileContent" class="profile-content"></div>
            </div>
        </div>

        <div id="voiceModal" class="modal">
            <div class="modal-content voice-modal">
                <span class="close">&times;</span>
                <h2 data-translate="voiceAssistant">Voice Assistant</h2>
                <div class="voice-container">
                    <div id="voiceStatus" class="voice-status" data-translate="voiceReady">Ready to listen...</div>
                    <button id="startVoiceBtn" class="btn-voice-large">🎤 <span data-translate="startListening">Start Listening</span></button>
                    <div id="voiceTranscript" class="voice-transcript"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/soilData.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/cropData.js"></script>
    <script src="js/explainableAI.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
